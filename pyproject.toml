[project]
name = "mnemos-agent"
version = "0.3.0"
description = "Agent memory with dated facts, temporal retrieval and source-linked history"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["activegraph"]

[project.scripts]
mnemos = "mnemos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnemos"]
